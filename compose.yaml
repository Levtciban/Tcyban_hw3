services:
  app:
    build: .
    user: "10001:10001"
    read_only: true
    mem_limit: 256m
    cpus: 1.0
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
      - GREETING=${GREETING:-Hello, Docker!}
      - STORAGE=${STORAGE:-redis}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATA_FILE=${DATA_FILE:-/data/counter.db}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-8000}/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  redis_data: